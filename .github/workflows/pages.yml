name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # VITE_STATIC swaps the HTTP client for the in-tab engine, since Pages
      # cannot run the Node/sqlite API.
      - name: Build static site
        env:
          VITE_STATIC: '1'
          VITE_BASE: /noct/
          # Optional: the crowd Worker URL. Unset builds keep the authored shares.
          VITE_CROWD_API: ${{ vars.CROWD_API }}
        run: npm run build

      # Pages serves 404.html for unknown paths; a copy of index.html keeps
      # deep links like /noct/play working.
      - name: SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
