<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Noct — a new board every night</title>
    <meta
      name="description"
      content="Seven nightly boards — Common, Rare, Noct, chess, mines, pairs and lights — plus ten side tables: Snake, 2048, Reversi, Checkers, Connect Four, Dominoes, Word Well, Memory Bell, Mancala and Peg Solitaire. Seventeen living pixel worlds under ten skies, no account."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Noct" />
    <meta property="og:title" content="Noct — seventeen small games under one sky" />
    <meta
      property="og:description"
      content="A new board every night at 00:00 UTC: the night choir, the empty hall, four lantern grids, chess, mines, keepsakes, windows, and ten quiet side tables — with birds, fish, moths and wind across every world."
    />
    <meta property="og:url" content="https://noct-fk1vla.freebuff.site/" />
    <meta property="og:image" content="https://noct-fk1vla.freebuff.site/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The valley at night: a castle tower, lit cottages, pines and a bridge over black water." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Noct — seventeen small games under one sky" />
    <meta name="twitter:image" content="https://noct-fk1vla.freebuff.site/og.png" />
    <meta name="theme-color" content="#080817" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f8ecd3" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <script>
      // Set the theme before paint so there is no flash of the wrong palette.
      try {
        var stored = JSON.parse(localStorage.getItem('noct.settings.v1') || '{}');
        var choice = stored.theme || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          choice === 'dark' || (choice === 'system' && prefersDark) ? 'dark' : 'light';
        document.documentElement.dataset.motion = stored.motion === 'reduced' ? 'reduced' : 'system';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        Noct needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>
    <script>
      // Never leave a blank page: if the bundle fails to load, say so and offer a reload.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family: system-ui, -apple-system, sans-serif; padding: 28px; max-width: 32rem; line-height: 1.5">' +
            '<h1 style="font-size: 1.4rem; margin: 0 0 8px">Noct could not start</h1>' +
            '<p style="margin: 0 0 16px; opacity: 0.75">The page loaded but its script did not. This is usually a stale cache.</p>' +
            '<button onclick="location.reload()" style="font: inherit; padding: 10px 16px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer">Reload</button>' +
            '</div>';
        }, 5000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
