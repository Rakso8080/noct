<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Noct — seven nightly boards and three arcade tables</title>
    <meta
      name="description"
      content="Common: give the answer everybody gives. Rare: give the one nobody gives. Noct: one spark per row, column and tone. Plus chess, mines, pairs and lights — and three arcade tables: Snake, 2048 and Reversi. Ten small games, no account."
    />
    <meta name="theme-color" content="#0b0d10" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f5f2ea" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <script>
      // Set the theme before paint so there is no flash of the wrong palette.
      try {
        var stored = JSON.parse(localStorage.getItem('noct.settings.v1') || '{}');
        var choice = stored.theme || 'system';
        var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme =
          choice === 'dark' || (choice === 'system' && prefersDark) ? 'dark' : 'light';
        document.documentElement.dataset.motion = stored.motion === 'reduced' ? 'reduced' : 'system';
      } catch (e) {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: system-ui, sans-serif; padding: 24px">
        Noct needs JavaScript to run. Please enable it and reload.
      </p>
    </noscript>
    <script>
      // Never leave a blank page: if the bundle fails to load, say so and offer a reload.
      window.addEventListener('load', function () {
        setTimeout(function () {
          var root = document.getElementById('root');
          if (!root || root.childElementCount > 0) return;
          root.innerHTML =
            '<div style="font-family: system-ui, -apple-system, sans-serif; padding: 28px; max-width: 32rem; line-height: 1.5">' +
            '<h1 style="font-size: 1.4rem; margin: 0 0 8px">Noct could not start</h1>' +
            '<p style="margin: 0 0 16px; opacity: 0.75">The page loaded but its script did not. This is usually a stale cache.</p>' +
            '<button onclick="location.reload()" style="font: inherit; padding: 10px 16px; border-radius: 999px; border: 1px solid currentColor; background: transparent; color: inherit; cursor: pointer">Reload</button>' +
            '</div>';
        }, 5000);
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
